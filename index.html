<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Board Portal</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}
label{display:block;margin-top:1rem;font-size:.9rem;color:#aaa}
input,select,button{width:100%;padding:.6rem;margin-top:.3rem;font-size:1rem;border-radius:6px;border:1px solid #444;background:#222;color:#eee;box-sizing:border-box}
button.go{background:#0072bc;border:0;margin-top:1.2rem;cursor:pointer}
.ch{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .6rem}.ch button,#tabs button{width:auto;padding:.35rem .7rem;font-size:.85rem;margin:0;cursor:pointer;border-radius:999px}
#tabs{display:flex;gap:.4rem;margin-top:1rem}#tabs button.on{background:#ff8c00;color:#000;border-color:#ff8c00}
#board{background:#000;color:#ff8c00;font-family:monospace;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 4px #ff8c0088;padding:.8rem;margin-top:.5rem;border-radius:6px;min-height:5rem}
.r{display:flex;gap:.5rem;align-items:center;margin-top:.3rem}.b{min-width:1.4rem;padding:0 .3rem;box-sizing:border-box;text-align:center;color:#000;font-weight:bold;border-radius:999px;text-shadow:none}.m{margin-left:auto}
.hide{display:none}small{color:#aaa}a{color:#6cf}
</style></head><body>
<h2>Display Board</h2>
<label>Show<select id="view"><option value="metro">LA Metro rail &amp; bus</option><option value="airport">Airport flights (OpenSky)</option></select></label>

<div id="metroBox">
<label>Station or bus stop<input id="station" list="sl" placeholder="Pick below or start typing…" autocomplete="off"></label><datalist id="sl"></datalist>
<div id="chips"></div>
<label id="tabBox" class="hide">This station has rail and bus. Board shows<select id="tab"><option value="alternate">Alternate: rail, then bus</option><option value="rail">Rail only</option><option value="bus">Bus only</option></select></label>
<label>Data source<select id="mode"><option value="auto">Auto (live if available, else schedule)</option><option value="realtime">Live only</option><option value="schedule">Schedule only</option></select></label>
</div>

<div id="airBox" class="hide">
<label>Airport<select id="airport"></select></label>
<label>Flights<select id="flights"><option value="both">Arrivals + departures</option><option value="arrivals">Arrivals only</option><option value="departures">Departures only</option></select></label>
</div>

<label>Rows (1–4, 3 looks best)<input id="max" type="number" min="1" max="4" value="3"></label>
<label>Brightness (5–255)<input id="bright" type="number" min="5" max="255" value="40"></label>
<label style="display:flex;gap:.6rem;align-items:center"><input id="offOn" type="checkbox" style="width:auto;margin:0"> Turn display off daily (Los Angeles time)</label>
<div style="display:flex;gap:.6rem"><label style="flex:1">Off at<input id="offStart" type="time" value="23:00"></label><label style="flex:1">On at<input id="offEnd" type="time" value="06:00"></label></div>
<button class="go" id="save">Save to board</button><p id="msg"></p>
<div id="tabs"></div><div id="board">Loading…</div>
<p><small>The preview shows your current picks without saving. <a href="/sim.html" target="_blank">Open the LED simulator</a></small></p>
<script>
const $=id=>document.getElementById(id);let stations=[],pv=[],pt=0;
const sel=()=>stations.find(x=>x.n===$("station").value),air=()=>$("view").value=="airport";
$("airport").replaceChildren(..."LAX BUR LGB SNA ONT SAN SFO OAK SJC LAS PHX SEA PDX DEN DFW ORD ATL JFK LGA EWR BOS MIA LHR".split(" ").map(c=>new Option(c)));
function ui(){const s=sel();$("airBox").classList.toggle("hide",!air());$("metroBox").classList.toggle("hide",air());$("tabBox").classList.toggle("hide",air()||!(s&&s.rail.length&&s.bus.length))}
function chips(){const G=[["primary","Your stations"],["focus","Your bus stops"],["hub","Hubs"],["terminal","Line ends"]];$("chips").replaceChildren();
 for(const [t,h] of G){const l=stations.filter(s=>s.tag==t);if(!l.length)continue;const k=document.createElement("small");k.textContent=h;const w=document.createElement("div");w.className="ch";
  for(const s of l){const b=document.createElement("button");b.type="button";b.textContent=s.n.replace(/ \[[^\]]*\]/,"")+(s.rail.length&&s.bus.length?" + bus":"");b.onclick=()=>{$("station").value=s.n;ui();preview()};w.append(b)}
  $("chips").append(k,w)}}
(async()=>{
  stations=await (await fetch("/stations.json")).json();
  $("sl").replaceChildren(...stations.map(s=>new Option(s.n)));chips();
  const c=await (await fetch("/api/config")).json();
  if(c.view)$("view").value=c.view;if(c.name)$("station").value=c.name;if(c.airport)$("airport").value=c.airport;if(c.flights)$("flights").value=c.flights;
  if(c.max)$("max").value=c.max;if(c.bright)$("bright").value=c.bright;if(c.mode)$("mode").value=c.mode;if(c.tab)$("tab").value=c.tab;
  $("offOn").checked=!!c.offOn;if(c.offStart)$("offStart").value=c.offStart;if(c.offEnd)$("offEnd").value=c.offEnd;
  ui();preview();
})();
$("view").onchange=()=>{ui();preview()};$("station").oninput=()=>{ui();preview()};$("tab").onchange=$("mode").onchange=$("airport").onchange=$("flights").onchange=()=>preview();
$("save").onclick=async()=>{
  const a=air(),s=sel();if(!a&&!s){$("msg").textContent="Pick a station or bus stop from the list.";return}
  const r=await fetch("/api/config",{method:"POST",body:JSON.stringify({view:$("view").value,name:s?s.n:"",rail:s?s.rail:[],bus:s?s.bus:[],tab:$("tab").value,airport:$("airport").value,flights:$("flights").value,max:$("max").value,bright:$("bright").value,mode:$("mode").value,offOn:$("offOn").checked,offStart:$("offStart").value,offEnd:$("offEnd").value})});
  $("msg").textContent=r.ok?"Saved! The board updates within 15 seconds.":"Error: "+await r.text();
};
function url(){if(air())return`/api/arrivals?airport=${$("airport").value}&flights=${$("flights").value}`;const s=sel();return s?`/api/arrivals?stop=${s.rail}&bus=${s.bus}&tab=${$("tab").value}&mode=${$("mode").value}`:"/api/arrivals"}
async function preview(){
  const d=await (await fetch(url())).json();
  if(d.off){$("tabs").replaceChildren();$("board").innerHTML="<small>Display is off (scheduled)</small>";return}
  pv=d.tabs||[{t:"",src:d.src,rows:d.rows}];if(pt>=pv.length)pt=0;draw(d);
}
function draw(d){
  $("tabs").replaceChildren(...(pv.length>1?pv.map((x,i)=>{const b=document.createElement("button");b.textContent=x.t;b.className=i==pt?"on":"";b.onclick=()=>{pt=i;draw(d)};return b}):[]));
  const p=pv[pt];$("board").innerHTML=`<small>${d.name||""} · ${d.view} · source: ${p.src||d.src}</small>`+(p.rows.length?p.rows.map(r=>`<div class="r"><span class="b" style="background:#${r.c}">${r.l}</span>${r.d}<span class="m">${r.s||((p.src=="sched"?"~":"")+r.m+" min")}</span></div>`).join(""):"<div>No trains soon</div>");
}
setInterval(preview,15000);
</script></body></html>
