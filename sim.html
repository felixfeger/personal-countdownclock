<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Simulator</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--mut:#666;--bd:#cfcfca;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#eee;--mut:#999;--bd:#333}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#eee;--mut:#999;--bd:#333}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:1rem}
canvas{width:100%;display:block;border:6px solid #000;border-radius:6px;background:#050505}
select,button{font-size:1rem;padding:.5rem;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--fg)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}p{color:var(--mut);font-size:.9rem}
</style></head><body><main>
<h2>Board simulator</h2>
<canvas id="c"></canvas>
<div class="bar"><select id="sc"><option value="live">Live data from this site</option><option value="union">Demo: Union Station (rail + bus tabs)</option><option value="l78">Demo: Line 78 stop</option><option value="lax">Demo: LAX flights</option></select>
<select id="rows"><option>1</option><option>2</option><option selected>3</option><option>4</option></select><span id="st" style="align-self:center;color:var(--mut)"></span></div>
<p>A 128×32 preview of what the LED board draws. On your own site it shows your real data (add <code>?stop=80214,80409&amp;bus=5001</code> to test without saving). Anywhere else it falls back to sample data. Real hardware looks a little crisper.</p>
</main><script>
const W=128,H=32,S=6,AMB="#ff8c00",cv=document.getElementById("c"),g=cv.getContext("2d");cv.width=W*S;cv.height=H*S;
const o=Object.assign(document.createElement("canvas"),{width:W,height:H}).getContext("2d",{willReadFrequently:true});
const R=(l,c,d,m,s)=>({l,c,d,m,s});
const DEMO={union:{src:"sched",rows:[],tabs:[{t:"RAIL",src:"sched",rows:[R("A","0072BC","Azusa",2),R("B","E3131B","North Hollywood",4),R("D","A05DA5","Wilshire/La Cienega",6),R("A","0072BC","Long Beach",9)]},{t:"BUS",src:"sched",rows:[R("16","F58220","Downtown LA",3),R("78","F58220","Arcadia",7),R("720","E4002B","Santa Monica",11),R("30","F58220","Pico",14)]}]},
 l78:{src:"sched",rows:[R("78","F58220","Arcadia",5),R("78","F58220","Arcadia",17),R("78","F58220","Arcadia",29),R("78","F58220","Arcadia",41)]},
 lax:{src:"opensky",rows:[R("A","2E9E4F","UAL123",7),R("A","2E9E4F","DAL456",12),R("D","0072BC","SWA789",0,"DEP"),R("D","0072BC","AAL321",0,"GND")]}};
let data=DEMO.union,ti=0;
function txt(s,x,y,col,cw,px){o.fillStyle=col;o.font=px+"px monospace";o.textBaseline="top";[...s].forEach((ch,i)=>o.fillText(ch,x+i*cw,y))}
function frame(){
  const t=data.tabs?data.tabs[ti%data.tabs.length]:data,n=Math.min(t.rows.length,+document.getElementById("rows").value),rows=t.rows.slice(0,n),sch=t.src==="sched";
  o.clearRect(0,0,W,H);
  if(data.off){/* scheduled off */}else if(!n)txt("NO TRAINS SOON",30,12,AMB,6,8);
  else{const rh=Math.floor(H/n),big=rh>=16,cw=big?12:6,ch=big?16:8,r=Math.min(Math.floor(rh/2)-1,8);
   rows.forEach((x,i)=>{const cy=i*rh+rh/2,lab=String(x.l),bw=lab.length>1?lab.length*cw+4:(r>=4?2*r+2:8),h=Math.min(big?17:9,2*r+2);
    o.fillStyle="#"+x.c;
    if(lab.length>1)o.fillRect(0,cy-h/2,bw,h);else if(r>=4){o.beginPath();o.arc(bw/2,cy,r,0,7);o.fill()}else o.fillRect(bw/2-3,cy-4,8,8);
    txt(lab,lab.length>1?2:bw/2-(big?5:2),cy-(big?7:3),"#000",cw,big?16:8);
    const m=x.m,tt=x.s||(m<=0?"ARR":(sch?"~":"")+m+" min"),tx=bw+4,dest=String(x.d).toUpperCase().slice(0,Math.max(0,Math.floor((W-tx-tt.length*cw-4)/cw)));
    txt(dest,tx,cy-ch/2,AMB,cw,big?16:8);txt(tt,W-tt.length*cw,cy-ch/2,AMB,cw,big?16:8)})}
  const px=o.getImageData(0,0,W,H).data;g.fillStyle="#050505";g.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,lit=px[i+3]>110&&px[i]+px[i+1]+px[i+2]>60;g.beginPath();g.arc(x*S+S/2,y*S+S/2,S*.38,0,7);g.fillStyle=lit?`rgb(${px[i]},${px[i+1]},${px[i+2]})`:"#1a1208";g.fill()}
}
async function pick(){const v=document.getElementById("sc").value,st=document.getElementById("st");ti=0;
  if(v==="live"){try{const r=await fetch("/api/arrivals"+location.search);if(!r.ok||!(r.headers.get("content-type")||"").includes("json"))throw 0;data=await r.json();st.textContent="Live";}catch(e){data=DEMO.union;st.textContent="No live API here, showing sample data";}}
  else{data=DEMO[v];st.textContent="Sample data"}frame()}
document.getElementById("sc").onchange=pick;document.getElementById("rows").onchange=frame;
setInterval(()=>{if(data.tabs){ti++;frame()}},8000);setInterval(()=>{if(document.getElementById("sc").value==="live")pick()},15000);pick();
</script></body></html>
